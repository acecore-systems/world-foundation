name: Translation
description: 翻訳・用語・多言語対応に関する Issue
title: '[Translation]: '
labels: ['translation']
body:
  - type: textarea
    id: summary
    attributes:
      label: 概要
      description: 翻訳・用語・多言語対応の概要を 1-3 行で書いてください。
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: 背景・目的
      description: なぜ必要か、どの文書・用語・言語に影響するかを書いてください。
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 完了条件
      description: レビュー時に完了判断できるチェックリストを書いてください。
      placeholder: |
        - [ ] 対象ファイルの翻訳または用語修正が完了している
        - [ ] 原文との意味差分を確認している
        - [ ] Glossary への影響を確認している
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 対象範囲・除外範囲
      description: 今回扱う文書・言語と、扱わない範囲を書いてください。
      placeholder: |
        対象:
        - docs/ja/
        - docs/en/

        除外:
        - 今回は更新しない関連文書
    validations:
      required: true

  - type: textarea
    id: related
    attributes:
      label: 関連パス・URL
      description: 関連する docs、glossary、issue、PR を書いてください。

  - type: textarea
    id: verification
    attributes:
      label: 確認方法
      description: 完了後にどの文書・用語・意味差分を確認するかを書いてください。
      placeholder: |
        - 原文との意味差分確認
        - Glossary との整合確認
        - Safety / Non-goals への影響確認
    validations:
      required: true

  - type: input
    id: source
    attributes:
      label: 対象ファイル
      description: 翻訳対象または修正対象のファイルパスを書いてください。
    validations:
      required: true

  - type: input
    id: language
    attributes:
      label: 言語
      description: 対象言語を書いてください。例 ja, en
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: 内容
      description: 翻訳内容、表現の問題、用語の揺れなどを書いてください。
    validations:
      required: true

  - type: textarea
    id: glossary
    attributes:
      label: 用語集への影響
      description: glossary/terms.yml の追加・変更が必要か書いてください。

  - type: dropdown
    id: status
    attributes:
      label: 翻訳ステータス
      options:
        - draft
        - needs review
        - reviewed
        - blocked

  - type: textarea
    id: semantic-diff
    attributes:
      label: 原文と翻訳の意味の差分
      description: 原文から意味が変わっている可能性を書いてください。

  - type: textarea
    id: review-reason
    attributes:
      label: レビューが必要な理由
      description: 用語、思想、安全性、法務、文化差など、レビューが必要な理由を書いてください。

  - type: textarea
    id: notes
    attributes:
      label: 補足
      description: 制約、依存関係、追加で確認すべき文書などがあれば書いてください。
