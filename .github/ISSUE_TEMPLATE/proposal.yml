name: Proposal
description: 設計変更の提案を作成する
title: "[Proposal]: "
labels: ["type:proposal"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 提案概要
      description: 提案内容を簡潔に書いてください。
    validations:
      required: true
  - type: textarea
    id: target
    attributes:
      label: 対象
      description: 影響を受ける文書やモジュールを書いてください。
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: リスク
      description: この提案のリスクや悪用可能性を書いてください。
  - type: textarea
    id: alternatives
    attributes:
      label: 代替案
      description: 検討した代替案があれば書いてください。
